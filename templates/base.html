<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChaseFlow for Orbyte</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">ChaseFlow <span>for Orbyte</span></div>
    <div class="topbar-right">
      <nav>
        {% set ep = request.endpoint %}
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if ep == 'dashboard' else '' }}">Dashboard</a>
        <a href="{{ url_for('check_overdue') }}" class="{{ 'active' if ep in ('check_overdue', 'draft_reminder') else '' }}">Check Overdue</a>
        <a href="{{ url_for('activity_log') }}" class="{{ 'active' if ep == 'activity_log' else '' }}">Activity Log</a>
      </nav>
      <span class="pill-badge"><span class="dot"></span> Connected to Orbyte Hub</span>
    </div>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
